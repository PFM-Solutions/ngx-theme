<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html {
        background: #d4d4d8;
        overflow: auto;
      }
      body {
        position: relative;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        font-family: 'Adwaita Sans', sans-serif;
      }
      .copy {
        position: absolute;
        left: 80px;
        top: 80px;
        width: 460px;
        height: 480px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .scope {
        font-size: 26px;
        letter-spacing: 0.01em;
        margin-bottom: 8px;
      }
      h1 {
        font-family: 'URW Gothic', sans-serif;
        font-weight: 600;
        font-size: 84px;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .pitch {
        margin-top: 24px;
        font-size: 30px;
        line-height: 1.3;
      }
      .logo {
        margin-top: auto;
        align-self: flex-start;
      }
      .logo img {
        display: block;
        height: 80px;
        width: auto;
      }
      .win {
        position: absolute;
        left: 580px;
        top: 96px;
        width: 800px;
        height: 600px;
        border-radius: 18px;
        overflow: hidden;
      }
      .pane {
        position: absolute;
        inset: 0;
        padding: 0;
      }
      .lightp {
        background: #f8fafc;
        color: #1f2933;
        --surface: #fff;
        --border: #e2e8f0;
        --line: #e2e8f0;
      }
      .darkp {
        background: #0a1724;
        color: #e2e8f0;
        --surface: #122536;
        --border: #23394d;
        --line: #23394d;
        clip-path: circle(300px at 215px 205px);
      }
      .top {
        height: 52px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 20px;
        border-bottom: 1px solid var(--border);
      }
      .top i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--line);
      }
      .content {
        padding: 32px 36px;
      }
      .h {
        width: 260px;
        height: 26px;
        border-radius: 6px;
        background: currentColor;
        opacity: 0.85;
      }
      .t {
        margin-top: 14px;
        width: 420px;
        height: 12px;
        border-radius: 6px;
        background: var(--line);
      }
      .seg {
        margin-top: 30px;
        display: inline-flex;
        gap: 6px;
        padding: 6px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .seg span {
        padding: 10px 22px;
        border-radius: 8px;
        font-size: 20px;
        font-weight: 600;
      }
      .seg .on {
        background: #83b925;
        color: #14210a;
      }
      .cards {
        margin-top: 28px;
        display: grid;
        grid-template-columns: repeat(3, 200px);
        gap: 18px;
      }
      .cards div {
        height: 150px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .ring {
        position: absolute;
        left: 580px;
        top: 96px;
        width: 800px;
        height: 600px;
        border-radius: 18px;
        overflow: hidden;
        pointer-events: none;
      }
      .ring::before {
        content: '';
        position: absolute;
        left: -85px;
        top: -95px;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        border: 3px solid #83b925;
      }
      .cursor {
        position: absolute;
        left: 789px;
        top: 298px;
        width: 34px;
      }
      body {
        background: #0078be;
        color: #fff;
      }
      .pitch {
        color: #e3f1fa;
      }
      .scope {
        color: #b3d9f0;
      }
      .win {
        box-shadow: 0 40px 80px -24px rgb(0 32 56 / 0.6);
      }
    </style>
  </head>
  <body>
