name: Release

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # `npm stage` requires npm >= 11.15.
      - run: npm install --global npm@^11.15.0
      - run: npm ci
      - uses: changesets/action@v2
        with:
          publish-script: npm run release
