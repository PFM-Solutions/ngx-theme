name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Angular ${{ matrix.angular }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: [21, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --legacy-peer-deps: the demo's Angular CLI 22 declares a peer on Angular 22.
      - name: Install Angular ${{ matrix.angular }}
        if: matrix.angular != 22
        run: >-
          npm install --no-save --legacy-peer-deps
          @angular/cdk@${{ matrix.angular }}
          @angular/common@${{ matrix.angular }}
          @angular/compiler@${{ matrix.angular }}
          @angular/core@${{ matrix.angular }}
          @angular/platform-browser@${{ matrix.angular }}
      - run: npm run check
      - run: npm test
      - run: npm run build:lib
      # The demo is built once: Angular CLI 21 requires TypeScript < 6, which the workspace does not use.
      - name: Build demo
        if: matrix.angular == 22
        run: npm run build:demo

  commitlint:
    name: Commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: >-
          npx --yes -p @commitlint/cli -p @commitlint/config-conventional
          commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
